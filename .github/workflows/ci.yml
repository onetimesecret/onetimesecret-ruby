name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily at 06:00 UTC
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  test:
    name: Test (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.1"
          - "3.2"
          - "3.3"
          - "3.4"
        include:
          - ruby: "head"
            experimental: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake test

  package:
    name: Build packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build onetimesecret
        run: bundle exec rake build

      - name: Build onetime compatibility package
        working-directory: compat/onetime
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/compat/onetime/Gemfile
        run: |
          bundle install
          bundle exec rake build

  live:
    name: Live API tests
    runs-on: ubuntu-latest
    # Only run on a schedule or when triggered manually. Never on push/PR,
    # since these tests hit an external production service over the network.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    env:
      ONETIME_LIVE: "1"
      ONETIME_BASE_URL: "https://eu.onetimesecret.com"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Run live API tests
        run: bundle exec rake test
