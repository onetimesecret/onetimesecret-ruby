name: Release

# Publishes the gem to RubyGems when a v* tag is pushed.
#
# Authentication is RubyGems Trusted Publishing (OIDC) — no API key is stored
# in this repository. The trusted publisher for the `onetime` gem must be
# configured once at
# https://rubygems.org/gems/onetime/trusted_publishers
# (repository onetimesecret/onetime-ruby, workflow release.yml,
# environment rubygems.org). The environment name below must match that
# record exactly — RubyGems compares it to the OIDC token's `environment`
# claim as a plain string. See docs/releasing.md.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    environment:
      name: rubygems.org
      url: https://rubygems.org/gems/onetime
    permissions:
      contents: write # create the GitHub release
      id-token: write # mint the OIDC token RubyGems verifies
    # This job can mint a RubyGems publishing token and write to the
    # repository, so every action is pinned to an immutable commit SHA: a
    # moved upstream tag must not be able to swap out code running with those
    # permissions. Dependabot keeps the pins current (.github/dependabot.yml).
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # A tag that disagrees with lib/onetime/version.rb would publish a gem
      # nobody can find by tag. Fail before anything is pushed.
      - name: Verify the tag matches Onetime::VERSION
        run: |
          version="$(ruby -Ilib -ronetime/version -e 'print Onetime::VERSION')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Onetime::VERSION ($version)" >&2
            exit 1
          fi

      - name: Run tests
        run: bundle exec rake test

      - name: Publish to RubyGems
        uses: rubygems/release-gem@052cc82692552de3ef2b81fd670e41d13cba8092 # v1.4.0
