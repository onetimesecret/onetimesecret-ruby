name: Release

# Publishes the canonical gem from v* tags and the dependency-only compatibility
# gem from onetime-v* tags. Both use RubyGems Trusted Publishing (OIDC), so no
# API key is stored in this repository. See docs/releasing.md for the required
# publisher records and release order.

on:
  push:
    tags:
      - "v*"
      - "onetime-v*"

permissions:
  contents: read

jobs:
  canonical:
    name: Publish onetimesecret
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    environment:
      name: rubygems.org
      url: https://rubygems.org/gems/onetimesecret
    permissions:
      contents: write # Bundler's release task may push its version tag
      id-token: write # mint the OIDC token RubyGems verifies
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Verify the tag matches Onetime::VERSION
        run: |
          version="$(ruby -Ilib -ronetime/version -e 'print Onetime::VERSION')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Onetime::VERSION ($version)" >&2
            exit 1
          fi

      - name: Run tests
        run: bundle exec rake test

      - name: Publish to RubyGems
        uses: rubygems/release-gem@052cc82692552de3ef2b81fd670e41d13cba8092 # v1.4.0

  compatibility:
    name: Publish onetime compatibility package
    if: startsWith(github.ref_name, 'onetime-v')
    runs-on: ubuntu-latest
    environment:
      name: rubygems.org
      url: https://rubygems.org/gems/onetime
    permissions:
      contents: write # Bundler's release task may push its version tag
      id-token: write # mint the OIDC token RubyGems verifies
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/compat/onetime/Gemfile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Verify the tag matches the compatibility package version
        working-directory: compat/onetime
        run: |
          version="$(ruby -e 'print Gem::Specification.load("onetime.gemspec").version')"
          tag="${GITHUB_REF_NAME#onetime-v}"
          if [ "$version" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match onetime.gemspec ($version)" >&2
            exit 1
          fi

      - name: Publish to RubyGems
        uses: rubygems/release-gem@052cc82692552de3ef2b81fd670e41d13cba8092 # v1.4.0
        with:
          working-directory: compat/onetime
